<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">brxic developer profile</title>
  <desc id="description">A modern blue developer profile banner for brxic</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0b1b31" />
      <stop offset="1" stop-color="#102a43" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="22%" r="65%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.32" />
      <stop offset="1" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.075" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.48" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)" />
  <rect width="1200" height="320" rx="24" fill="url(#glow)" />
  <rect width="1200" height="320" rx="24" fill="url(#grid)" />

  <g opacity="0.65">
    <circle cx="1050" cy="60" r="130" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18" />
    <circle cx="1050" cy="60" r="86" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.2" />
    <path d="M900 256C980 180 1080 176 1170 118" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.25" />
  </g>

  <g transform="translate(76 55)" filter="url(#shadow)">
    <rect width="1048" height="210" rx="18" fill="#0b1220" fill-opacity="0.82" stroke="#334155" />
    <path d="M0 48H1048" stroke="#334155" />
    <circle cx="24" cy="24" r="5" fill="#fb7185" />
    <circle cx="44" cy="24" r="5" fill="#fbbf24" />
    <circle cx="64" cy="24" r="5" fill="#34d399" />
    <text x="524" y="29" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">~/brxic/profile</text>

    <text x="44" y="108" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ whoami</text>
    <text x="44" y="165" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="58" font-weight="750" letter-spacing="-2">brxic</text>
    <rect x="44" y="184" width="166" height="3" rx="1.5" fill="url(#accent)" />

    <text x="342" y="132" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="500">Software Development</text>
    <text x="342" y="166" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">Cybersecurity  •  Automation  •  Continuous Learning</text>
  </g>
</svg>
